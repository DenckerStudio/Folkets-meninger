name: CI

# pull_request: lint-and-build, test-unit, db-security, migration-sql-lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      STORTINGET_SESSION_ID: 2025-2026
      STORTINGET_PERIODE_ID: 2025-2029
      NEXT_PUBLIC_STORTINGET_SESSION_ID: 2025-2026
      NEXT_PUBLIC_STORTINGET_PERIODE_ID: 2025-2029
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Load public test Supabase env
        run: |
          set -a
          source .env.test
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck:evals
      - run: npm run test:unit
      - run: npm run build

  test-unit:
    runs-on: ubuntu-latest
    env:
      STORTINGET_SESSION_ID: 2025-2026
      STORTINGET_PERIODE_ID: 2025-2029
      NEXT_PUBLIC_STORTINGET_SESSION_ID: 2025-2026
      NEXT_PUBLIC_STORTINGET_PERIODE_ID: 2025-2029
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Load public test Supabase env
        run: |
          test -f .env.test
          set -a
          source .env.test
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run test:unit

  db-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - name: Sikkerhetsvakt prod-lignende uten 140000 og 160000
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c \
            "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO postgres, anon, authenticated, service_role;"
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
          DEFAULTS_URL="postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" \
          ./scripts/run-prod-like-db-security.sh

  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Load public test Supabase env
        run: |
          set -a
          source .env.test
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true
      - name: fm-cms unit tests
        working-directory: cms
        run: |
          # cms/package-lock.json is still on the npm 10 lockfile shape; Node 24 ships npm 11.
          npm i -g npm@10.9.2
          npm ci --ignore-scripts
          npm run test:unit
      - name: fm-cms integration tests (Payload outbox)
        working-directory: cms
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/cms_test?search_path=payload
          PAYLOAD_SECRET: ci-test-secret
          CMS_INTEGRATION_TESTS: '1'
          NODE_ENV: test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cms_test -c 'CREATE SCHEMA IF NOT EXISTS payload;'
          npx payload migrate
          npm run test:integration

  migration-sql-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sjekk nye migrasjoner for REVOKE/RLS-mønster
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git fetch origin main --depth=1 2>/dev/null || true
          FILES=$(git diff --name-only "$BASE" HEAD -- supabase/migrations/*.sql || true)
          if [ -z "$FILES" ]; then echo "Ingen nye migrasjoner"; exit 0; fi
          node scripts/check-migrations.mjs $FILES
