<!DOCTYPE html>
<html lang="nb" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="brukere-fixture.css" />
  <title>Brukere – slett dialog</title>
</head>
<body data-scene="dialog">
  <div class="page dimmed">
    <h1>Brukere</h1>
    <div class="dialog-backdrop">
      <div class="dialog" role="dialog" aria-labelledby="dlg-title">
        <h2 id="dlg-title">Slett bruker permanent</h2>
        <p class="muted">Skriv brukerens e-postadresse for å bekrefte. Permanent sletting blokkeres ved aktivt Stemme+-abonnement.</p>
        <label for="email">E-post</label>
        <input id="email" type="email" placeholder="ola@example.com" />
        <div class="dialog-actions">
          <button type="button" class="btn outline">Avbryt</button>
          <button type="button" class="btn danger">Slett permanent</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
